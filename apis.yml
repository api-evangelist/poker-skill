aid: poker-skill
name: Poker Skill
description: >-
  Poker Skill is a mobile-first poker-training app for iOS and Android that turns
  learning poker into a daily habit. It teaches through interactive puzzles,
  bite-sized guided lessons, and daily practice reps that adapt to the player's
  skill level, from complete beginner to serious improver. At its core is
  "Showdown AI", a versioned game-theory engine that deals practice hands, plays
  the opponents, and grades every decision by its expected value — an approach the
  company says replicates the methods behind Pluribus, the first AI to beat top
  professionals at six-max no-limit hold'em. The product is subscription-funded
  with a free-to-start funnel, and is backed by Initialized Capital. Poker Skill
  is a consumer application and does not publish a public developer API program.
